name: radar

# 定时任务：采集 → 有新快照才提交数据并重新部署。
# 推送代码：不采集，只重新生成并部署站点（改了看板或分析逻辑马上生效）。
on:
  schedule:
    # 官方榜单约北京时间 10 点刷新，时间不固定，一天检查多次；没刷新时什么都不做。
    - cron: "25 2 * * *"   # 北京时间 10:25
    - cron: "40 3 * * *"   # 11:40
    - cron: "10 6 * * *"   # 14:10
    - cron: "0 9 * * *"    # 17:00
    - cron: "0 13 * * *"   # 21:00
  workflow_dispatch:
    inputs:
      collect:
        description: "先采集一次"
        type: boolean
        default: true
      allow_stale:
        description: "官方没刷新也写快照（一般不需要）"
        type: boolean
        default: false
      force:
        description: "覆盖当天已有的快照"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/**", "reports/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 完整采集约 300 个详情页，每秒最多 1 个请求，通常 10–15 分钟
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -t . -v

      - name: Collect
        id: collect
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: |
          ARGS=""
          if [ "${{ inputs.allow_stale }}" = "true" ]; then ARGS="$ARGS --allow-stale"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m radar collect $ARGS

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.collect.outputs.new_snapshot }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "官方榜单还没刷新，本次不部署"
          fi

      - name: Build site
        if: steps.decide.outputs.publish == 'true'
        run: python -m radar build --out _site

      - name: Commit data
        if: steps.decide.outputs.publish == 'true' && steps.collect.outputs.new_snapshot == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
